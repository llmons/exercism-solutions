name: Auto-merge exercism-syncer PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: >
      github.event.pull_request.user.login == 'exercism-solutions-syncer[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: auto-merge-syncer-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    steps:
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review "${{ github.event.pull_request.number }}" --approve

      - name: Merge PR (merge commit) and delete source branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 10); do
            if gh pr merge "$PR_NUMBER" \
                --merge \
                --delete-branch \
                --match-head-commit "$HEAD_SHA"; then
              echo "PR #$PR_NUMBER merged and branch deleted"
              exit 0
            fi
            if [ "$(gh pr view "$PR_NUMBER" --json state -q .state)" = "MERGED" ]; then
              echo "PR #$PR_NUMBER already merged (by concurrent run)"
              exit 0
            fi
            echo "PR #$PR_NUMBER not mergeable yet (attempt $i/10); retrying in 15s..."
            sleep 15
          done
          echo "::error::PR #$PR_NUMBER could not be merged after 10 attempts"
          exit 1

      - name: Ensure source branch deleted (belt and suspenders)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "/repos/${{ github.repository }}/git/refs/heads/${{ github.event.pull_request.head.ref }}" \
            --silent || echo "Branch already deleted or lives in a fork — nothing to clean up"
